[workspace]
resolver = "2"
members = ["kotizi", "test-usdc"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# soroban-sdk is pinned to what OpenZeppelin Stellar Contracts 0.8.0 depends on.
[workspace.dependencies]
soroban-sdk = "=28.0.0"
stellar-tokens = "=0.8.0"
stellar-macros = "=0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
